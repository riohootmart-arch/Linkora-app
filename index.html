const TAB_ICONS={
 n:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="7" rx="2"/><rect x="14" y="4" width="7" height="7" rx="2"/><rect x="8.5" y="14" width="7" height="7" rx="2"/><path d="M10 7.5h4M8 11l2 3M16 11l-2 3"/></svg>',
 a:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 20 6v5.1c0 5-3.4 8.3-8 10.8-4.6-2.5-8-5.8-8-10.8V6l8-3.2Z"/><path d="M8.3 9.1v5.7M8.3 9.1l2.1 2.3M8.3 9.1 6.4 11M13 10.1c0-1 .7-1.7 1.8-1.7s1.8.7 1.8 1.7c0 2-3.6 2.1-3.6 4.3h3.8"/></svg>',
 r:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4.2a4 4 0 0 1-8 0V4Z"/><path d="M8 6H4v1.5A4.5 4.5 0 0 0 8.5 12M16 6h4v1.5a4.5 4.5 0 0 1-4.5 4.5M12 12v5M8.5 20h7M10 17h4"/></svg>'
};
let DATA=null,tab="n",q="",adultOK=false,rkCat="normal";
try{adultOK=localStorage.getItem("lk_adult")==="1"}catch(e){}
function avatar(c){const l=esc(c.name.trim().charAt(0).toUpperCase()||"?");
 return`<div class="av" style="background:${grad(c)}">${l}${c.av?`<img src="av/${c.id}.jpg" alt="" onload="this.classList.add('ok')" onerror="this.remove()">`:""}</div>`}
function row(c,i,rank){const meta=`<span class="num">${cmp(c.members)} ${T.mem}</span>`+(c.cat==="adult"?`<span class="chip a">+18</span>`:c.type==="group"?`<span class="chip">${T.gr}</span>`:"");
 return`<div class="card" style="animation-delay:${Math.min(i,12)*35}ms">${rank?`<div class="rk num">${i+4}</div>`:""}${avatar(c)}<div class="mid"><div class="nm">${esc(c.name)}</div><div class="meta">${meta}</div></div>
 <button class="go" data-l="${esc(c.link)}">${T.join}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>`}
function podium(a){const o=[1,0,2].filter(i=>a[i]);return`<div class="pod">`+o.map(i=>{const c=a[i];return`<div class="p f${i+1}" style="animation-delay:${i*70}ms"><div class="medal">${i+1}</div>${avatar(c)}<div class="nm">${esc(c.name)}</div><div class="mem num">${cmp(c.members)}<small>${T.mem}</small></div></div>`}).join("")+`</div>`}
function render(){let cs=DATA.channels.filter(c=>c.name.toLowerCase().includes(q.trim().toLowerCase()));let h="";
 if(tab==="n")cs=cs.filter(c=>c.cat==="normal");else if(tab==="a")cs=cs.filter(c=>c.cat==="adult");else cs=cs.filter(c=>c.cat===rkCat);
 cs.sort(tab==="r"?(x,y)=>y.members-x.members:(x,y)=>x.rnd-y.rnd);
 if(!cs.length)h=`<div class="empty"><div class="big">${q?"🔍":"🌱"}</div><b>${q?T.none:T.empty}</b><div>${q?T.none2:""}</div></div>`;
 else if(tab==="r"&&!q.trim())h=podium(cs)+cs.slice(3).map((c,i)=>row(c,i,true)).join("");
 else h=cs.map((c,i)=>row(c,i)).join("");
 if(tab==="r")h=`<div class="rkt"><button class="${rkCat==="normal"?"on":""}" data-c="normal">🔵 Normal</button><button class="${rkCat==="adult"?"on":""}" data-c="adult">+18</button></div>`+h;
 $("view").innerHTML=h+`<div class="foot">${T.upd}: ${new Date(DATA.updated).toLocaleDateString(lang,{day:"numeric",month:"short"})}</div>`;
 document.querySelectorAll(".rkt button").forEach(b=>b.onclick=()=>{const c=b.dataset.c;if(c===rkCat)return;if(c==="adult"&&!adultOK){$("sheet").classList.add("on");return}hap();rkCat=c;render()});
 document.querySelectorAll(".go").forEach(b=>b.onclick=()=>{const l=b.dataset.l;if(!l)return;try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred("light")}catch(e){}
  if(tg&&/^https:\/\/t\.me\//.test(l))tg.openTelegramLink(l);else window.open(l,"_blank")})}
function seg(){const s=$("seg");s.querySelectorAll("button").forEach(b=>b.remove());
 TABS.forEach(k=>{const b=document.createElement("button");b.innerHTML=`<span class="tab-icon" aria-hidden="true">${TAB_ICONS[k]}</span><span class="tab-label">${T[k]}</span>`;b.className=k===tab?"on":"";b.setAttribute("aria-label",T[k]);b.setAttribute("aria-pressed",k===tab?"true":"false");b.onclick=()=>pick(k);s.appendChild(b)});
 $("thumb").style.transform=`translateX(${TABS.indexOf(tab)*100}%)`}
function pick(k){if(k===tab)return;if(k==="a"&&!adultOK){$("sheet").classList.add("on");return}
 if(k==="r"&&DATA&&!DATA.channels.some(c=>c.cat==="normal")&&DATA.channels.some(c=>c.cat==="adult")){if(!adultOK){$("sheet").classList.add("on");window._toRank=1;return}rkCat="adult"}
 hap();tab=k;seg();render();window.scrollTo({top:0,behavior:"smooth"})}
$("s_t").textContent=T.st;$("s_p").textContent=T.sp;$("s_y").textContent=T.sy;$("s_n").textContent=T.sn;
$("s_y").onclick=()=>{adultOK=true;try{localStorage.setItem("lk_adult","1")}catch(e){}$("sheet").classList.remove("on");if(window._toRank){window._toRank=0;rkCat="adult";pick("r")}else if(tab==="r"){rkCat="adult";render()}else pick("a")};
$("s_n").onclick=()=>$("sheet").classList.remove("on");
$("q").placeholder=T.q;$("sub").textContent=T.sub;document.title="Linkora";
$("q").oninput=e=>{q=e.target.value;if(DATA)render()};
function load(){$("view").innerHTML='<div class="sk"></div>'.repeat(6);
 fetch("data.json?t="+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{DATA=d;DATA.channels.forEach(c=>c.rnd=Math.random());$("cnt").innerHTML=`<i>●</i> <span class="num">${d.channels.length}</span>`;seg();render()})
 .catch(()=>{$("view").innerHTML=`<div class="empty"><div class="big"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5a18 18 0 0 1 24 0"/><path d="M8.5 17a11.5 11.5 0 0 1 15 0"/><path d="M12.7 21.2a5.2 5.2 0 0 1 6.6 0"/><path d="M16 25.5v.2"/><path d="M6 5l20 22" stroke="#1685ff" stroke-width="2.5"/></svg></div><b>${T.err}</b><div class="err-copy">${T.none2}</div><button class="retry" id="rt">${T.retry}</button></div>`;$("rt").onclick=load})}
seg();load();
</script></body></html>
