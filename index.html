<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark light">
<title>Linkora</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0d16;--bg2:#10142199;--card:#131827;--card2:#1a2033;--line:#ffffff14;--txt:#f1f4fb;--mut:#8d97ae;--acc:#5b8cff;--acc2:#8a63ff;
--grad:linear-gradient(135deg,#4f8cff 0%,#7b5cff 100%);--glow:#5b8cff33;--ok:#34d399;--r:20px;--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
:root[data-theme=light]{--bg:#f3f5fb;--bg2:#ffffffcc;--card:#ffffff;--card2:#eef1f9;--line:#0f172a12;--txt:#0f172a;--mut:#64708a;--glow:#5b8cff22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--txt);font:500 15px/1.4 var(--font);background:
radial-gradient(520px 320px at 85% -60px,#7b5cff30,transparent 70%),radial-gradient(520px 340px at -10% -40px,#4f8cff2e,transparent 70%),var(--bg);
-webkit-font-smoothing:antialiased;padding-bottom:calc(36px + env(safe-area-inset-bottom))}
:root[data-theme=light] body{background:radial-gradient(520px 320px at 85% -60px,#7b5cff1c,transparent 70%),radial-gradient(520px 340px at -10% -40px,#4f8cff1c,transparent 70%),var(--bg)}
.num{font-variant-numeric:tabular-nums}
header{padding:22px 18px 8px;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:14px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 24px var(--glow),inset 0 1px 0 #ffffff55}
.logo svg{width:22px;height:22px}
.ht{flex:1;min-width:0}.ht b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.ht span{color:var(--mut);font-size:12.5px;font-weight:500}
.pill{flex:none;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--txt)}
.pill i{font-style:normal;color:var(--ok)}
.bar{position:sticky;top:0;z-index:10;padding:10px 16px 12px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:linear-gradient(var(--bg) 55%,transparent)}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.seg button{position:relative;z-index:1;border:0;background:none;color:var(--mut);font:700 13.5px var(--font);padding:10px 4px;border-radius:12px;transition:color .25s;cursor:pointer}
.seg button.on{color:#fff}
.thumb{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:12px;background:var(--grad);box-shadow:0 6px 18px var(--glow);transition:transform .35s cubic-bezier(.2,.9,.3,1.1)}
.search{position:relative;margin-top:10px}
.search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--mut)}
.search input{width:100%;padding:13px 14px 13px 42px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:500 15px var(--font);outline:none;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--glow)}
.search input::placeholder{color:var(--mut)}
.wrap{padding:2px 16px}
.card{position:relative;display:flex;align-items:center;gap:13px;padding:12px 13px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
animation:in .45s both cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.av{flex:none;position:relative;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:21px;overflow:hidden;box-shadow:inset 0 0 0 1px #ffffff22}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.av img.ok{opacity:1}
.mid{flex:1;min-width:0}
.nm{font-weight:700;font-size:15.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;gap:6px;white-space:nowrap;margin-top:3px;color:var(--mut);font-size:12.5px;font-weight:600}
.chip{padding:2px 8px;border-radius:999px;background:var(--card2);font-size:11px;font-weight:700;color:var(--mut)}
.chip.a{background:#ff4d6d22;color:#ff6b86}
.go{flex:none;display:flex;align-items:center;gap:5px;border:0;background:var(--grad);color:#fff;border-radius:14px;padding:10px 12px;font:700 13px var(--font);cursor:pointer;box-shadow:0 6px 16px var(--glow);transition:transform .15s}
.go:active{transform:scale(.94)}.go svg{width:14px;height:14px}
.pod{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:9px;align-items:end;margin:6px 0 16px}
.p{position:relative;text-align:center;padding:16px 8px 14px;border-radius:22px;background:var(--card);border:1px solid var(--line);animation:in .5s both}
.p .av{margin:0 auto 9px;width:60px;height:60px;border-radius:20px}
.p.f1{padding-top:20px;background:linear-gradient(180deg,#fbbf2430,var(--card) 70%);border-color:#fbbf2455}
.p.f1 .av{width:70px;height:70px;border-radius:24px}
.p.f2{background:linear-gradient(180deg,#cbd5e128,var(--card) 70%);border-color:#cbd5e140}
.p.f3{background:linear-gradient(180deg,#f9731628,var(--card) 70%);border-color:#f9731640}
.medal{position:absolute;top:-11px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#1a1300;box-shadow:0 4px 12px #0006}
.f1 .medal{background:linear-gradient(135deg,#fde68a,#f59e0b)}.f2 .medal{background:linear-gradient(135deg,#f1f5f9,#94a3b8)}.f3 .medal{background:linear-gradient(135deg,#fdba74,#c2410c);color:#fff}
.p .nm{font-size:13px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25;min-height:2.5em}
.p .mem{margin-top:6px;font-weight:800;font-size:15px}
.p .mem small{display:block;color:var(--mut);font-weight:600;font-size:11px}
.rk{flex:none;width:22px;text-align:center;font-weight:800;color:var(--mut);font-size:14px}
.mem2{flex:none;text-align:right;font-weight:800;font-size:14px}
.mem2 small{display:block;color:var(--mut);font-weight:600;font-size:11px}
.empty{text-align:center;color:var(--mut);padding:56px 20px}
.empty .big{font-size:42px;margin-bottom:8px}
.sk{height:78px;border-radius:var(--r);margin-bottom:10px;background:linear-gradient(100deg,var(--card) 30%,var(--card2) 50%,var(--card) 70%);background-size:200% 100%;animation:sh 1.3s infinite linear;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}
.retry{margin-top:14px;border:0;background:var(--grad);color:#fff;border-radius:14px;padding:11px 20px;font:700 14px var(--font)}
.sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;background:#000a;backdrop-filter:blur(4px)}
.sheet.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet>div{width:100%;background:var(--card);border-radius:28px 28px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom));text-align:center;animation:up .35s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet h3{margin:6px 0 6px;font-size:19px;font-weight:800}.sheet p{margin:0 0 20px;color:var(--mut)}
.sheet .em{font-size:44px}
.sheet button{display:block;width:100%;border:0;border-radius:16px;padding:14px;font:700 15px var(--font);margin-top:9px}
.sheet .y{background:var(--grad);color:#fff}.sheet .n{background:var(--card2);color:var(--txt)}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:14px}
</style></head><body>
<header>
 <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="6" r="2.6"/><circle cx="18" cy="18" r="2.6"/><path d="M8.3 10.8l7.4-3.6M8.3 13.2l7.4 3.6"/></svg></div>
 <div class="ht"><b>Linkora</b><span id="sub"></span></div>
 <div class="pill num" id="cnt"></div>
</header>
<div class="bar">
 <div class="seg" id="seg"><div class="thumb" id="thumb"></div></div>
 <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" autocomplete="off"></div>
</div>
<div class="wrap" id="view"></div>
<div class="sheet" id="sheet"><div><div class="em">🔞</div><h3 id="s_t"></h3><p id="s_p"></p><button class="y" id="s_y"></button><button class="n" id="s_n"></button></div></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;
const L={
es:{sub:"Explora la red de canales",n:"Normal",a:"+18",r:"Ranking",q:"Buscar canal o grupo…",join:"Unirme",mem:"miembros",ch:"Canal",gr:"Grupo",none:"No encontramos nada",none2:"Prueba con otra búsqueda.",err:"No se pudo cargar",retry:"Reintentar",
 st:"Contenido para adultos",sp:"Esta sección incluye canales +18. ¿Tienes 18 años o más?",sy:"Sí, tengo 18 o más",sn:"Volver",total:"en la red",upd:"Actualizado",empty:"Aún no hay canales aquí"},
en:{sub:"Explore the channel network",n:"Normal",a:"+18",r:"Ranking",q:"Search channel or group…",join:"Join",mem:"members",ch:"Channel",gr:"Group",none:"Nothing found",none2:"Try a different search.",err:"Couldn't load",retry:"Retry",
 st:"Adult content",sp:"This section includes 18+ channels. Are you 18 or older?",sy:"Yes, I'm 18 or older",sn:"Go back",total:"in the network",upd:"Updated",empty:"No channels here yet"},
pt:{sub:"Explore a rede de canais",n:"Normal",a:"+18",r:"Ranking",q:"Buscar canal ou grupo…",join:"Entrar",mem:"membros",ch:"Canal",gr:"Grupo",none:"Nada encontrado",none2:"Tente outra busca.",err:"Não foi possível carregar",retry:"Tentar de novo",
 st:"Conteúdo adulto",sp:"Esta seção inclui canais +18. Você tem 18 anos ou mais?",sy:"Sim, tenho 18 ou mais",sn:"Voltar",total:"na rede",upd:"Atualizado",empty:"Ainda não há canais aqui"},
ru:{sub:"Обзор сети каналов",n:"Обычные",a:"+18",r:"Рейтинг",q:"Найти канал или группу…",join:"Войти",mem:"участников",ch:"Канал",gr:"Группа",none:"Ничего не найдено",none2:"Попробуйте другой запрос.",err:"Не удалось загрузить",retry:"Повторить",
 st:"Контент для взрослых",sp:"В этом разделе есть каналы 18+. Вам есть 18 лет?",sy:"Да, мне есть 18",sn:"Назад",total:"в сети",upd:"Обновлено",empty:"Здесь пока нет каналов"},
hi:{sub:"चैनल नेटवर्क देखें",n:"सामान्य",a:"+18",r:"रैंकिंग",q:"चैनल या ग्रुप खोजें…",join:"जुड़ें",mem:"सदस्य",ch:"चैनल",gr:"ग्रुप",none:"कुछ नहीं मिला",none2:"दूसरी खोज आज़माएँ।",err:"लोड नहीं हो सका",retry:"फिर कोशिश करें",
 st:"वयस्क सामग्री",sp:"इस सेक्शन में 18+ चैनल हैं। क्या आपकी उम्र 18 या अधिक है?",sy:"हाँ, मैं 18+ हूँ",sn:"वापस",total:"नेटवर्क में",upd:"अपडेट",empty:"यहाँ अभी कोई चैनल नहीं"}};
const qs=new URLSearchParams(location.search);
let lang=(qs.get("lang")||(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.language_code)||navigator.language||"es").slice(0,2);
if(!L[lang])lang="es";const T=L[lang];document.documentElement.lang=lang;
const dark=tg&&tg.colorScheme?tg.colorScheme==="dark":!(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches);
document.documentElement.dataset.theme=dark?"dark":"light";
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor(dark?"#0a0d16":"#f3f5fb");tg.setBackgroundColor(dark?"#0a0d16":"#f3f5fb")}catch(e){}}
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cmp=n=>new Intl.NumberFormat(lang==="hi"?"en-IN":lang,{notation:"compact",maximumFractionDigits:1}).format(n);
const hap=k=>{try{tg&&tg.HapticFeedback&&tg.HapticFeedback.selectionChanged()}catch(e){}};
const grad=c=>{const h=(c.id*67+c.name.length*29)%360;return`linear-gradient(135deg,hsl(${h} 70% 55%),hsl(${(h+45)%360} 70% 42%))`};
const TABS=["n","a","r"],LAB={n:()=>"🔵 "+T.n,a:()=>"🔞 "+T.a,r:()=>"🏆 "+T.r};
let DATA=null,tab="n",q="",adultOK=false;
try{adultOK=localStorage.getItem("lk_adult")==="1"}catch(e){}
function avatar(c){const l=esc(c.name.trim().charAt(0).toUpperCase()||"?");
 return`<div class="av" style="background:${grad(c)}">${l}${c.av?`<img src="av/${c.id}.jpg" alt="" onload="this.classList.add('ok')" onerror="this.remove()">`:""}</div>`}
function row(c,i,rank){const meta=`<span class="num">${cmp(c.members)} ${T.mem}</span>`+(c.cat==="adult"?`<span class="chip a">+18</span>`:c.type==="group"?`<span class="chip">${T.gr}</span>`:"");
 return`<div class="card" style="animation-delay:${Math.min(i,12)*35}ms">${rank?`<div class="rk num">${i+4}</div>`:""}${avatar(c)}<div class="mid"><div class="nm">${esc(c.name)}</div><div class="meta">${meta}</div></div>
 <button class="go" data-l="${esc(c.link)}">${T.join}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>`}
function podium(a){const o=[1,0,2].filter(i=>a[i]);return`<div class="pod">`+o.map(i=>{const c=a[i];return`<div class="p f${i+1}" style="animation-delay:${i*70}ms"><div class="medal">${i+1}</div>${avatar(c)}<div class="nm">${esc(c.name)}</div><div class="mem num">${cmp(c.members)}<small>${T.mem}</small></div></div>`}).join("")+`</div>`}
function render(){let cs=DATA.channels.filter(c=>c.name.toLowerCase().includes(q.trim().toLowerCase()));let h="";
 if(tab==="n")cs=cs.filter(c=>c.cat==="normal");else if(tab==="a")cs=cs.filter(c=>c.cat==="adult");else cs=cs.filter(c=>c.cat==="normal");
 cs.sort((x,y)=>y.members-x.members);
 if(!cs.length)h=`<div class="empty"><div class="big">${q?"🔍":"🌱"}</div><b>${q?T.none:T.empty}</b><div>${q?T.none2:""}</div></div>`;
 else if(tab==="r"&&!q.trim())h=podium(cs)+cs.slice(3).map((c,i)=>row(c,i,true)).join("");
 else h=cs.map((c,i)=>row(c,i)).join("");
 $("view").innerHTML=h+`<div class="foot">${T.upd}: ${new Date(DATA.updated).toLocaleDateString(lang,{day:"numeric",month:"short"})}</div>`;
 document.querySelectorAll(".go").forEach(b=>b.onclick=()=>{const l=b.dataset.l;if(!l)return;try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred("light")}catch(e){}
  if(tg&&/^https:\/\/t\.me\//.test(l))tg.openTelegramLink(l);else window.open(l,"_blank")})}
function seg(){const s=$("seg");s.querySelectorAll("button").forEach(b=>b.remove());
 TABS.forEach(k=>{const b=document.createElement("button");b.textContent=LAB[k]();b.className=k===tab?"on":"";b.onclick=()=>pick(k);s.appendChild(b)});
 $("thumb").style.transform=`translateX(${TABS.indexOf(tab)*100}%)`}
function pick(k){if(k===tab)return;if(k==="a"&&!adultOK){$("sheet").classList.add("on");return}hap();tab=k;seg();render();window.scrollTo({top:0,behavior:"smooth"})}
$("s_t").textContent=T.st;$("s_p").textContent=T.sp;$("s_y").textContent=T.sy;$("s_n").textContent=T.sn;
$("s_y").onclick=()=>{adultOK=true;try{localStorage.setItem("lk_adult","1")}catch(e){}$("sheet").classList.remove("on");pick("a")};
$("s_n").onclick=()=>$("sheet").classList.remove("on");
$("q").placeholder=T.q;$("sub").textContent=T.sub;document.title="Linkora";
$("q").oninput=e=>{q=e.target.value;if(DATA)render()};
function load(){$("view").innerHTML='<div class="sk"></div>'.repeat(6);
 fetch("data.json?t="+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{DATA=d;$("cnt").innerHTML=`<i>●</i> <span class="num">${d.channels.length}</span>`;seg();render()})
 .catch(()=>{$("view").innerHTML=`<div class="empty"><div class="big">📡</div><b>${T.err}</b><br><button class="retry" id="rt">${T.retry}</button></div>`;$("rt").onclick=load})}
seg();load();
</script></body></html>
